appId: com.k12agent.desktop
# ⚠️ 品牌名的唯一来源是 `src/shared/brand.ts`（主进程与渲染进程共用）。
#    本文件与 `src/renderer/index.html` 的 <title> 是纯静态配置、无法 import，
#    改品牌名时**必须手工同步那两处**（brand.ts 里也留了同样的指引）。
# ★ 存储目录**不随品牌名变**：`src/main/index.ts` 的 applyStableUserDataSlug()
#   把 userData 钉在固定 slug 上，否则改一次名字就等于把学生的
#   config.json / learning.db / Pi 会话整体搬家（见那里的注释）。
productName: 智团团

# ★★ 只保留中文与英文的界面语言包（D-068）。
#   Electron 发行版自带 **55 个** `locales/*.pak`，解压后 **49MB** —— 而本应用只有中文界面、
#   只有一处用到原生对话框（`dialog.showSaveDialog`，导出学习档案），那两三个按钮文本
#   就是这些 pak 唯一的作用。保留 zh-CN + en-US 后 locales 降到约 1.9MB。
#   ⚠️ **英文包必须留**：学生的系统若是英文 Windows，删了它连「保存 / 取消」都会是别的语言。
#   ★ 这是 electron-builder 的**内建**选项（`ElectronFramework.removeUnusedLanguagesIfNeeded`），
#   不是 after-pack 里手写 rm —— 所以升级 electron-builder 时它仍然管用。
electronLanguages:
  - zh-CN
  - en-US

directories:
  buildResources: build
  output: dist
files:
  # ★★ 这里**没有**一条「排除 element-plus / monaco-editor…」的规则，是有意的（D-068）：
  #   渲染进程的依赖**全部由 vite 从 node_modules 打进 out/renderer**（renderer 段**没有**
  #   `externalizeDepsPlugin()`，见 electron.vite.config.ts），运行期不再需要 node_modules 里的副本。
  #   所以那 9 个渲染专用包被移进了 `devDependencies` —— electron-builder 只打包
  #   `dependencies`，一处改动净减 **31 个包 / 167MB**（含 element-plus 的传递依赖）。
  #   ⚠️ **不要**为了「整齐」把它们移回 dependencies；反过来，往 `dependencies` 里加东西
  #   就等于「它会进包」，只该加**主进程 / preload 运行时真正 require 的**那几个。
  #   守卫：`tests/bundle-budget.test.ts`。
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!tests/*'
  - '!scripts/*'
  # 构建缓存（`tsc --composite` 的增量状态，实测 0.38MB）—— 不是程序的一部分
  - '!*tsbuildinfo'
  # ★★ 渲染进程的资源**已经有一份**在 `out/renderer/` 里：vite 把 `publicDir`（= `resources/`）
  #   整份拷进去，运行期读的也正是那一份（`pyodide-runner.ts` 的 `PYODIDE_INDEX_URL = './pyodide/'`
  #   在打包态解析成 `file://…/out/renderer/pyodide/`）。所以这里再收一份是**纯重复**：
  #   实测这一份 15.73MB，而且因为 `asarUnpack: resources/**` 还实占磁盘。
  #   ⚠️ `resources/brand/**` **必须留** —— 主进程的窗口图标亲自读它（`src/main/index.ts` 的 icon）。
  #   规矩：`resources/` 下只放**主进程亲自读**的东西；给渲染进程的资源由 vite 从 publicDir 拷。
  - '!resources/pyodide/**'
  # ── 按架构分发（票 03）──
  # npm 把**所有平台**的可选原生包都装了下来（实测：`@esbuild/win32-arm64/esbuild.exe`
  # 10,404,864 B、`@mariozechner/clipboard-*` 11 个平台包 ≈ 14MB），与本机 win32-x64 无关。
  # 这些包**不在 Pi 的运行时导入路径上**（见票 03 的导入图结论），删的是体积不是能力。
  - '!**/node_modules/@esbuild/aix-*/**'
  - '!**/node_modules/@esbuild/android-*/**'
  - '!**/node_modules/@esbuild/darwin-*/**'
  - '!**/node_modules/@esbuild/freebsd-*/**'
  - '!**/node_modules/@esbuild/linux-*/**'
  - '!**/node_modules/@esbuild/netbsd-*/**'
  - '!**/node_modules/@esbuild/openbsd-*/**'
  - '!**/node_modules/@esbuild/openharmony-*/**'
  - '!**/node_modules/@esbuild/sunos-*/**'
  - '!**/node_modules/@esbuild/win32-arm64/**'
  - '!**/node_modules/@esbuild/win32-ia32/**'
  - '!**/node_modules/@mariozechner/clipboard-darwin-*/**'
  - '!**/node_modules/@mariozechner/clipboard-linux-*/**'
  - '!**/node_modules/@mariozechner/clipboard-win32-arm64-*/**'
asarUnpack:
  # ★★ 关卡 B₁（票 03）：原生文件在 asar **里面**跑不起来 —— asar 只是 Electron 的 fs 虚拟层，
  #    `child_process.spawn()` 与操作系统的 `.node` 加载器都不认识它，必须解包成实体文件。
  #
  # 实测结论（0.85.1，见 `node scripts/pi-import-graph.mjs`）：
  #   - Pi **包根导入**的路径上**没有 esbuild**：esbuild 只被
  #     `@earendil-works/chord/dist/node/bundle.js` 导入，而该文件只能经 `chord/bundler`
  #     或 `chord/node/package.js` 到达，Pi 从不导入这两者。所以 esbuild 是「保险丝」不是「真需求」。
  #   - **真需求是 clipboard 的 `.node`**：包根导入会急切加载
  #     `@mariozechner/clipboard-win32-x64-msvc/clipboard.win32-x64-msvc.node`
  #     （经 `dist/utils/clipboard.js` → `copyToClipboard`）。
  #   两组都解包：esbuild 满足票 03 的显式要求 + 兜住「将来用 chord 打包扩展」的场景。
  - '**/node_modules/esbuild/**'
  - '**/node_modules/@esbuild/**'
  - '**/node_modules/@mariozechner/clipboard*/**'
  # 渲染进程的静态资源（如后续加本地自托管的 Pyodide/Monaco 大文件）走这里；
  # 注意 Pi 的文档/模板是**只读**访问，asar 内透明可用，不需要解包。
  - resources/**
extraResources:
  # 打包后的 Python sidecar（PyInstaller --onedir 产物）；
  # 运行期从 process.resourcesPath 解析：<resourcesPath>/server/k12-agent-server.exe
  #
  # ★★ 这里拷的是**磁盘上现成的那一份**，它**不随 electron-vite build 更新** ——
  #   这就是 P-072 的成因（包里跑着一个过期的后端，且不报任何错）。所以：
  #   ① `desktop/package.json` 的 `build` 先跑 `build:server`（= build_server.py --if-stale，
  #      过期内自动重打），`build:win` / `build:unpack` 在 electron-builder **之后**
  #      再跑 `check:server:packaged` 校验**包里的那一份**；
  #   ② 产物目录里的 `build-info.json`（源码指纹 + commit + 时间）**必须一起拷进去**，
  #      否则装包后的校验无从比对。**不要**在下面加排除规则把它挡掉。
  - from: ../server/dist/k12-agent-server
    to: server
win:
  # ★ 图标由 `server/scripts/make_brand_icons.py` 从 `logos/mainlogo.png` 生成
  #   （裁透明边 + 多尺寸 .ico）。改了 logo 就重跑那个脚本，不要手工导出。
  icon: build/icon.ico
  executableName: k12-agent-desktop
  # ★★ 绿色版压缩包的**文件名模式必须显式给**（这里只影响 zip 那种「归档」目标，
  #    nsis / portable 各有自己的 artifactName，会覆盖这一层）。
  #    不给的话 electron-builder 的默认模式是 `${productName}-${version}-${os}.${ext}`
  #    —— productName 是中文「智团团」，于是会产出 `智团团-0.1.0-win.zip`：
  #    ① CI 产物名与下载 URL 里带中文（跨平台解压/上传容易出编码问题）；
  #    ② 名字里**没有架构**，将来真出 arm64 时两份包会重名。
  artifactName: ${name}-${version}-win-${arch}.${ext}
  target:
    - nsis
    # ★ 便携（绿色）版：单个 exe，解压到临时目录运行，数据落 exe 同级 data/。
    #   与 nsis 的区别是「不安装、可放 U 盘」—— 演示现场最省事的一种形态。
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  # ★ 控制面板（程序和功能）里带上版本号 —— 学生/老师一眼能看出装的是哪一版，
  #   「升级到底成没成」不必再去翻文件属性。
  uninstallDisplayName: ${productName} ${version}

  # ★★ **引导式安装向导**（assisted installer），不是一键装完（D-067）。
  #   electron-builder 的 `oneClick` **默认是 true** —— 双击安装包就闷头装完，
  #   学生看不到任何选择、也不知道装到哪去了。改成 false 后走标准页面：
  #   欢迎 → 安装范围（仅我 / 所有用户）→ 安装位置 → 安装中 → 完成。
  oneClick: false

  # ★ 允许学生自己选安装位置（**只能用于引导式**：oneClick 为 true 时设它会直接报错）。
  allowToChangeInstallationDirectory: true

  createDesktopShortcut: always
  createStartMenuShortcut: true

  # ★★ **卸载 / 升级时绝不删学生数据**（D-067）。
  #   false = 卸载只删程序文件与快捷方式；`config.json` / `learning.db` /
  #   Pi 会话（`students/<id>/`）全部原样保留。
  #   ⚠️ 千万不要改成 true：安装器会把 `$APPDATA\<APP_FILENAME>` **整目录删掉**，
  #   而学生的全部数据正好就在那儿 —— userData slug 钉在 `k12-agent-desktop`
  #   （见 `src/main/index.ts` 的 applyStableUserDataSlug），与 APP_FILENAME 同名。
  #   守卫：`tests/installer-config.test.ts` 的 G21-2。
  deleteAppDataOnUninstall: false

  # ★ 安装向导固定中文：产品本身没有英文界面，半英文的安装器只会让人困惑
  #   （`language` 是 LCID，2052 = 简体中文；也决定 exe 版本信息块的语言）。
  installerLanguages: [zh_CN]
  language: "2052"

  # ★ 欢迎页见 `build/installer.nsh` —— electron-builder 的引导式安装器
  #   **默认没有欢迎页**，第一眼就是「选择安装范围」，很突兀。
  include: build/installer.nsh
npmRebuild: false

portable:
  artifactName: ${name}-${version}-portable.${ext}
  # 解压临时目录，不写注册表、不建快捷方式
  unpackDirName: k12-agent-desktop-portable

# ★ 便携标记：`src/main/index.ts` 的 applyPortableDataDir() 靠它判断
#   「这是便携版，把 userData 挪到 exe 同级 data/」。
#   随包放一个空文件即可（也可用环境变量 K12_PORTABLE=1 强制）。
extraFiles:
  - from: build/portable.marker
    to: portable.marker
