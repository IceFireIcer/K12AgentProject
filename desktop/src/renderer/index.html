<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>K12 AI 教学助手</title>
    <!--
      收紧 CSP：渲染层只允许加载本地资源。
      ⚠️ 后续接入 DeepSeek 时是 **sidecar 去请求外网**，渲染层不直连，
      因此 connect-src 只需放行本机回环的 sidecar。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
